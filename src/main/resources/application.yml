spring:
  application:
    name: teamplay-risk-radar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/riskradar}
    username: ${DB_USERNAME:riskradar}
    password: ${DB_PASSWORD:riskradar}
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway가 스키마 주인, JPA는 검증만
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
